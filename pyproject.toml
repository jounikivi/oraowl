# -----------------------------
# Ruff configuration
# -----------------------------
[tool.ruff]
line-length = 100
# Migraatioissa sallitaan pitkät rivit (E501), mutta muut Ruffin tarkistukset (E,F) pysyvät.
# Allow long lines (E501) in migrations, but keep other Ruff checks (E,F) enabled.
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

# -----------------------------
# Black configuration
# -----------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# -----------------------------
# Pytest configuration (optional, for local runs)
# -----------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "oraowl.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"

# -----------------------------
# isort configuration (optional, can be enabled later)
# -----------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["oraw_app", "oraowl"]

# -----------------------------