{% load static %}

<nav class="main-header navbar navbar-expand navbar-white navbar-light" style="background-color: #2E7D32;">

  <!-- ========================================================= -->
  <!-- Left side of navbar -->
  <!-- ========================================================= -->
  <ul class="navbar-nav">

    <!-- Hamburger / sidebar toggle button -->
    <li class="nav-item">
      <a class="nav-link" data-widget="pushmenu" href="#" role="button">
        <i class="fas fa-bars text-white"></i>
      </a>
    </li>

    <!-- Home -->
    <li class="nav-item d-none d-sm-inline-block">
      <a href="{% url 'oraw_app:home' %}" class="nav-link text-white">
        <i class="fas fa-home"></i> Koti
      </a>
    </li>

    <!-- Competitions -->
    <li class="nav-item d-none d-sm-inline-block">
      <a href="{% url 'oraw_app:competition_list' %}" class="nav-link text-white">
        <i class="fas fa-flag-checkered"></i> Kilpailut
      </a>
    </li>

    <!-- Athletes -->
    <li class="nav-item d-none d-sm-inline-block">
      <a href="{% url 'oraw_app:athletes_index' %}" class="nav-link text-white">
        <i class="fas fa-running"></i> Urheilijat
      </a>
    </li>

  </ul>

  <!-- ========================================================= -->
  <!-- Right side (login / logout / profile) -->
  <!-- ========================================================= -->
  <ul class="navbar-nav ml-auto">

    {% if request.user.is_authenticated %}
      <li class="nav-item dropdown">
        <a class="nav-link text-white" data-toggle="dropdown" href="#">
          <i class="fas fa-user-circle"></i> {{ request.user.username }}
        </a>
        <div class="dropdown-menu dropdown-menu-right">
          <a href="#" class="dropdown-item disabled">
            <i class="fas fa-user mr-2"></i> Profiili (tulossa)
          </a>
          <div class="dropdown-divider"></div>

          <!-- logout -->
          <form method="post" action="{% url 'oraw_app:logout' %}" class="dropdown-item p-0 m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-link dropdown-item w-100 text-left">
              <i class="fas fa-sign-out-alt mr-2"></i> Kirjaudu ulos
            </button>
          </form>
        </div>
      </li>

    {% else %}

      <li class="nav-item">
        <a href="{% url 'oraw_app:login' %}" class="nav-link text-white">
          <i class="fas fa-sign-in-alt"></i> Kirjaudu sisään
        </a>
      </li>

    {% endif %}

  </ul>
</nav>
