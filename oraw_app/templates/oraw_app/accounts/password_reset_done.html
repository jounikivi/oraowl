{% extends "oraw_app/base.html" %}
{% block title %}Palautuslinkki lähetetty{% endblock %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card card-outline card-success shadow-sm">
        <div class="card-header">
          <h1 class="card-title h5 mb-0">Tarkista sähköpostisi</h1>
        </div>
        <div class="card-body">
          <p>
            Jos antamasi sähköpostiosoite löytyy järjestelmästä, lähetimme
            sinulle viestin, jossa on linkki salasanan vaihtoon.
          </p>
          <p class="mb-0">
            <a href="{% url 'oraw_app:login' %}">Palaa kirjautumiseen</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
