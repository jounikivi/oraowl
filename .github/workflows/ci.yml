name: CI (minimal)

on:
  push:
    branches:
      - main
      - dev
      - Demo-release-v1.0
      - iofxml-v3-rewrite
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - Demo-release-v1.0
      - iofxml-v3-rewrite
      - "feature/**"

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: oraowl.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALLOWED_HOSTS: "127.0.0.1,localhost"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-django

      - name: Run Ruff (lint E + F)
        run: ruff check . --select E,F

      - name: Run pytest
        run: pytest -q
